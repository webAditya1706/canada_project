<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Responsive Table with Visible Dropdown</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Required to fix dropdown clipping inside responsive table */
        .table-responsive {
            overflow: visible;
        }

        .table-responsive table {
            margin-bottom: 0;
        }

        td {
            position: relative;
        }

        .dropdown-menu {
            z-index: 1050;
        }

        /* Optional: hide table overflow, but allow dropdown to break out */
        .scroll-wrapper {
            overflow-x: auto;
            position: relative;
        }

        .table-responsive .dropdown-menu {
            position: absolute !important;
            transform: translate3d(0px, 38px, 0px) !important;
        }
    </style>
</head>

<body>

    <div class="container my-5">
        <div class="scroll-wrapper">
            <div class="table-responsive">
                <table class="table table-bordered" style="min-width: 1000px;">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Customer</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>City</th>
                            <th>Actions</th> <!-- Last column -->
                        </tr>
                    </thead>
                    <tbody>
                        <tr>

                            <td>1234567890</td>
                            <td>Musakhedi</td>
                            <td>Indore</td>
                            <td>
                                <div class="dropdown">
                                    <button class="btn btn-sm btn-primary dropdown-toggle" type="button"
                                        data-bs-toggle="dropdown">
                                        Options
                                    </button>
                                    <ul class="dropdown-menu">
                                        <li><a class="dropdown-item" href="#">Edit</a></li>
                                        <li><a class="dropdown-item" href="#">Delete</a></li>
                                        <li><a class="dropdown-item" href="#">View</a></li>
                                    </ul>
                                </div>
                            </td>
                        </tr>
                        <tr>

                                        <li><a class="dropdown-item" href="#">View</a></li>
                                    </ul>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>1</td>
                            <td>Sadik</td>
                            <td>sadik@example.com</td>
                            <td>1234567890</td>
                            <td>Musakhedi</td>

                            <td>
                                <div class="dropdown">
                                    <button class="btn btn-sm btn-primary dropdown-toggle" type="button"

                                    </button><ul class="dropdown-menu">
                                        <li><a class="dropdown-item" href="#">Edit</a></li>

                                    </ul>

                            </td>
                        </tr>
                        <!-- More rows can go here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
