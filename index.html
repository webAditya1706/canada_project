<script>
$(document).ready(function () {
  // Initialize Select2 for all modals
  $('.modal').on('shown.bs.modal', function () {
    $('.js-example-basic-single', this).select2({
      dropdownParent: $(this).find('.modal-content'),
      minimumResultsForSearch: Infinity
    });
  });

  // Adjust dropdown direction on open
  $(document).on('select2:open', function (e) {
    const $select = $(e.target).next('.select2-container');
    const $dropdown = $('.select2-container--open .select2-dropdown');

    const modalBody = $select.closest('.modal-body');
    const selectTop = $select.position().top;
    const selectBottom = selectTop + $select.outerHeight();
    const dropdownHeight = $dropdown.outerHeight();
    const modalHeight = modalBody.innerHeight();

    if (selectBottom + dropdownHeight > modalHeight) {
      // Not enough space below → open upwards
      $dropdown.addClass('select2-dropdown--above');
      $dropdown.removeClass('select2-dropdown--below');
    } else {
      // Enough space → open downwards
      $dropdown.addClass('select2-dropdown--below');
      $dropdown.removeClass('select2-dropdown--above');
    }
  });
});
</script>
