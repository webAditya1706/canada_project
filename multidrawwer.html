<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacked Drawer + Modal</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Drawer 2 styled like an offcanvas */
    .drawer-modal .modal-dialog {
      position: fixed;
      right: 0;
      margin: 0;
      height: 100%;
      transform: translateX(100%);
      transition: transform .3s ease-out;
      max-width: 400px; /* drawer width */
    }

    .drawer-modal.show .modal-dialog {
      transform: translateX(0);
    }

    .drawer-modal .modal-content {
      height: 100%;
      border-radius: 0;
    }
  </style>
</head>

<body>

  <!-- Button to trigger Drawer 1 -->
  <button class="btn btn-primary m-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#drawer1"
    aria-controls="drawer1">
    Open Drawer 1
  </button>

  <!-- Drawer 1 -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="drawer1" aria-labelledby="drawer1Label"
    data-bs-backdrop="false" data-bs-scroll="true">
    <div class="offcanvas-header pb-1">
      <h5 id="drawer1Label">Drawer 1</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body pt-0">
      <p>This is Drawer 1 content.</p>

      <!-- Button to open Drawer 2 -->
      <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#drawer2">
        Open Drawer 2
      </button>
    </div>
  </div>

  <!-- Drawer 2 (Modal styled as drawer) -->
  <div class="modal fade drawer-modal" id="drawer2" tabindex="-1" aria-hidden="true" data-bs-backdrop="false">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header pb-1">
          <h5 class="modal-title">Drawer 2</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-0">
          <p>This is Drawer 2 content stacked on top of Drawer 1.</p>

          <!-- ✅ Button to open regular modal -->
          <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#infoModal">
            Open Info Modal
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Regular Modal on top of Drawer 2 -->
  <div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Info Modal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>This is a normal Bootstrap modal opened from Drawer 2.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
