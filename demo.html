<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table with Conditional Scrollbar</title>
  <style>
    .table-container {
      border: 2px solid black; /* Solid outer border */
    }

    /* Scrollable table (added dynamically if rows > 10) */
    .scrollable {
      max-height: 300px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px dashed black;
      padding: 8px;
      text-align: left;
    }

    thead th {
      background-color: #f4f4f4;
      position: sticky;
      top: 0;
    }
  </style>
</head>
<body>

  <div id="table-container" class="table-container">
    <table id="myTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody>
        <!-- Sample Data -->
        <tr><td>1</td><td>John</td><td>25</td></tr>
        <tr><td>2</td><td>Emma</td><td>28</td></tr>
        <tr><td>3</td><td>Alice</td><td>22</td></tr>
        <tr><td>4</td><td>Michael</td><td>30</td></tr>
        <tr><td>5</td><td>Sarah</td><td>27</td></tr>
        <tr><td>6</td><td>David</td><td>24</td></tr>
        <tr><td>7</td><td>James</td><td>29</td></tr>
        <tr><td>8</td><td>Linda</td><td>26</td></tr>
        <tr><td>9</td><td>Robert</td><td>31</td></tr>
        <tr><td>10</td><td>Olivia</td><td>23</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // Get the table and its container
    const tableContainer = document.getElementById("table-container");
    const tableBody = document.querySelector("#myTable tbody");
    
    // Count the number of rows
    const rowCount = tableBody.getElementsByTagName("tr").length;

    // Add scrollable class if rows > 10
    if (rowCount > 10) {
      tableContainer.classList.add("scrollable");
    }
  </script>

</body>
</html>
